<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Bear Exteriors — Scheduling Agent Demo</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐻</span>
      <div>
        <h1>Black Bear Exteriors — Scheduling Agent</h1>
        <p class="subtitle">Mastra + Deepgram Voice Agent — lead capture and Calendly booking, live over voice</p>
      </div>
    </div>
    <div class="controls">
      <span id="statusDot" class="status-dot disconnected"></span>
      <span id="statusText" class="status-text">Disconnected</span>
      <button id="connectBtn">Connect</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel transcript-panel">
      <h2>Live Transcript</h2>
      <div id="transcript" class="transcript"></div>
    </section>

    <aside class="side-column">
      <section class="panel">
        <h2>Tool Calls</h2>
        <div id="toolLog" class="log"><p class="empty">No tool calls yet.</p></div>
      </section>

      <section class="panel">
        <h2>Lead Info <span class="hint">(resource-scoped working memory)</span></h2>
        <pre id="memoryView" class="memory-view">— empty —</pre>
      </section>
    </aside>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
